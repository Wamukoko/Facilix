services:
  - type: web
    name: facilix-api
    runtime: image
    image:
      url: # Render builds from the Dockerfile in backend/
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: "1"
      - key: CORS_ORIGIN
        sync: false
